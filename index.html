<!doctype html>
<html lang="vi">
  <head>
    <script>
      try {
        const saved = localStorage.getItem("vocalearn-theme");
        document.documentElement.dataset.theme =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Khám phá lộ trình học từ vựng, xây dựng thư viện cá nhân và ôn tập bằng flashcard cùng VocaLearn."
    />
    <title>VocaLearn | Học từ vựng mỗi ngày</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
